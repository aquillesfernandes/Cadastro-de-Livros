<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Livros</title>
</head>
<body>
    <main>
        <section>
            <header>
                <h2>CADASTRO DE REFERÊNCIA BIBLIOGRÁFICA</h2>
                <p>Cadastre os livros recomendados para as disciplinas.</p>
            </header>

            <form action="/salvar-livro" method="POST">

                <fieldset>
                    <legend>Informações da Obra</legend>

                    <p>
                        <label for="titulo-livro">Título do Livro:</label>
                        <input type="text" id="titulo-livro" name="titulo-livro" required>
                    </p>

                    <p>
                        <label for="autor">Autor(es):</label>
                        <input type="text" id="autor" name="autor" required>
                    </p>

                    <p>
                        <label for="isbn">ISBN (13 dígitos):</label>
                        <input type="text" id="isbn" name="isbn" pattern="[0-9]{3}-[0-9]{2}-[0-9]{4}-[0-9]{3}-[0-9]{1}" placeholder="XXX-XX-XXXX-XXX-X" title="O formato deve ser XXX-XX-XXXX-XXX-X" required>
                    </p>

                    <p>
                        <label for="ano-publicacao">Ano de Publicação:</label>
                        <input type="number" id="ano-publicacao" name="ano-publicacao" required>
                        <span>(Ex: 2023)</span>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Detalhes Acadêmicos</legend>

                    <p>
                        <label for="curso-alvo">Curso Alvo:</label>
                        <select name="curso-alvo" id="curso-alvo" required>
                            <option value="">Selecione um curso...</option>
                            <option value="ES">Engenharia de Software</option>
                            <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
                            <option value="TC">Tronco Comum</option>
                        </select>
                    </p>

                    <p>
                        <label for="disciplina">Disciplina:</label>
                        <input type="text" id="disciplina" name="disciplina" required>
                    </p>

                    <p>
                        <label for="formato-material">Formato do Material:</label>
                        <input type="radio" id="formato-fisico" name="formato-material" value="fisico">
                        <label for="formato-material">Físico</label>
                        <input type="radio" id="formato-digital" name="formato-material" value="digital">
                        <label for="formato-material">Digital</label>
                        <input type="radio" id="formato-hibrido" name="formato-material" value="hibrido">
                        <label for="formato-material">Ambos</label>
                    </p>
                </fieldset>

                <button type="submit">Salvar Livro</button>

            </form>
        </section>
    </main>
</body>
</html>
